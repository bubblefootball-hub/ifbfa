f<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bubble Football Hub</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .welcome-box {
            max-width: 650px;
            margin: 80px auto;

            box-shadow: 0 0 20px rgba(179, 146, 18, 0.3);

        .welcome-text { color: #ffffff; font-size: 15px; margin-bottom: 10px; }

        .btn-enter {
            background: #b39212;
