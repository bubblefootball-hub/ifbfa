<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bumperball 3v3 - IFBFA Brain Trainer</title><a href="hub.html" style="display: inline-block; background: #e74c3c; color: #ffffff; border: 2px solid #ffffff; padding: 10px 25px; font-size: 14px; font-weight: bold; border-radius: 6px; text-decoration: none; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); box-shadow: 0 4px 10px rgba(0,0,0,0.4); font-family: Arial, sans-serif; letter-spacing: 0.5px; margin-top: 15px;">MAIN MENU</a></div>
    <style>
        body { margin: 0; background: #070d19; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; color: #fff; font-family: 'Arial', sans-serif; }
        #game-container { position: relative; box-shadow: 0 0 40px rgba(235,180,50,0.3); border-radius: 10px; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<div id="game-container"><canvas id="gameCanvas" width="800" height="630"></canvas></div>
<script>
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
let scoreBlue = 0, scoreRed = 0, turn = 'blue', announcement = "Your turn! Drag the blue bumper like a slingshot.", selectedBumper = null, isDragging = false, aiTimer = 0, mouseX = 0, mouseY = 0;

class Obj {
    constructor(x, y, r, team, m) { this.x = x; this.y = y; this.radius = r; this.team = team; this.vx = 0; this.vy = 0; this.mass = m; }
    update() {
        this.x += this.vx; this.y += this.vy; this.vx *= 0.97; this.vy *= 0.97;
        if (this.team !== 'ball' || (this.y < 330 || this.y > 410)) {
            if (this.x - this.radius < 50) { this.x = 50 + this.radius; this.vx *= -0.8; }
            if (this.x + this.radius > 750) { this.x = 750 - this.radius; this.vx *= -0.8; }
        }
        if (this.y - this.radius < 170) { this.y = 170 + this.radius; this.vy *= -0.8; }
        if (this.y + this.radius > 570) { this.y = 570 - this.radius; this.vy *= -0.8; }
    }
    draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.team === 'blue' ? '#1e90ff' : (this.team === 'red' ? '#dc143c' : '#ebb432');
        ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
        if (selectedBumper === this) { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 5, 0, Math.PI * 2); ctx.lineWidth = 2; ctx.strokeStyle = '#ebb432'; ctx.stroke(); }
    }
}

let bumpers = [], ball;
function resetMatch() {
    bumpers = [new Obj(180,260,24,'blue',1.5), new Obj(180,480,24,'blue',1.5), new Obj(300,370,24,'blue',1.5), new Obj(620,260,24,'red',1.5), new Obj(620,480,24,'red',1.5), new Obj(500,370,24,'red',1.5)];
    ball = new Obj(400, 370, 14, 'ball', 0.8); turn = 'blue'; announcement = "Your turn! Drag the blue bumper like a slingshot.";
}

function collide(o1, o2) {
    let dx = o2.x - o1.x, dy = o2.y - o1.y, dist = Math.hypot(dx, dy), minDist = o1.radius + o2.radius;
    if (dist < minDist && dist > 0) {
        let overlap = minDist - dist, nx = dx / dist, ny = dy / dist;
        o1.x -= nx * overlap * 0.5; o1.y -= ny * overlap * 0.5; o2.x += nx * overlap * 0.5; o2.y += ny * overlap * 0.5;
        let kx = o1.vx - o2.vx, ky = o1.vy - o2.vy, p = 2 * (nx * kx + ny * ky) / (o1.mass + o2.mass);
        o1.vx -= p * o2.mass * nx; o1.vy -= p * o2.mass * ny; o2.vx += p * o1.mass * nx; o2.vy += p * o1.mass * ny;
    }
}

canvas.addEventListener('mousedown', (e) => {
    if (turn !== 'blue') return; const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    for (let b of bumpers) if (b.team === 'blue' && Math.hypot(b.x - mx, b.y - my) < b.radius) { selectedBumper = b; isDragging = true; break; }
});
canvas.addEventListener('mousemove', (e) => { const r = canvas.getBoundingClientRect(); mouseX = e.clientX - r.left; mouseY = e.clientY - r.top; });
canvas.addEventListener('mouseup', () => {
    if (isDragging && selectedBumper) {
        selectedBumper.vx = (selectedBumper.x - mouseX) * 0.13; selectedBumper.vy = (selectedBumper.y - mouseY) * 0.13;
        selectedBumper = null; isDragging = false; turn = 'red'; aiTimer = Date.now(); announcement = "Opponent's turn... Calculating brain-training trajectory.";
    }
});

resetMatch();
function gameLoop() {
    let t = Date.now(); ctx.fillStyle = '#070d19'; ctx.fillRect(0, 0, 800, 630);
    
    // 🌊 Анимация золотого флага
    for (let x = 0; x < 800; x += 2) {
        let waveY = Math.sin(t * 0.0022 + x * 0.008) * 14;
        let shade = Math.sin(t * 0.0022 + x * 0.008) * 18;
        ctx.fillStyle = `rgb(${220+shade}, ${170+shade}, ${50+shade})`;
        
        if (x >= 60 && x <= 75) {
            ctx.fillStyle = `rgb(${15+shade}, ${45+shade}, ${145+shade})`;
        }
        ctx.fillRect(x, 0, 2, 330 + waveY);
    }

    // Буквы IFBFA
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.font = 'bold 64px Arial';
    ctx.textAlign = 'center';
    let centerWaveY = Math.sin(t * 0.0022 + 400 * 0.008) * 14;
    ctx.fillText("IFBFA", 410, 200 + centerWaveY);
    ctx.restore();

    // Граница игрового поля (Заканчивается на 570px)
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3; ctx.strokeRect(50, 170, 700, 400);

    // 🏛️ КРУПНЫЙ ОФИЦИАЛЬНЫЙ АНГЛИЙСКИЙ ХЕДЕР
    ctx.fillStyle = '#070d19'; ctx.fillRect(0, 0, 800, 140);
    ctx.strokeStyle = '#ebb432'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0,140); ctx.lineTo(800,140); ctx.stroke();

    ctx.fillStyle = '#ebb432'; ctx.font = 'bold 20px Arial'; ctx.fillText("BUMPERBALL — OFFICIAL IFBFA BRAIN TRAINER DISCIPLINE", 25, 35);
    ctx.fillStyle = '#ffffff'; ctx.font = '14px Arial';
    ctx.fillText("An educational, high-focus gameplay system presented by the Research Institute & National Sport Development Board.", 25, 70);
    ctx.fillText("Developed for cognitive agility and response tracking. Approved by an Olympic Champions family of medical professionals.", 25, 105);

    // Счёт на поле
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px Arial'; ctx.fillText(`BLUE: ${scoreBlue}  |  RED: ${scoreRed}`, 65, 195);
    
    // Ворота
    ctx.fillStyle = '#1e90ff'; ctx.fillRect(35, 330, 15, 80); ctx.fillStyle = '#dc143c'; ctx.fillRect(750, 330, 15, 80);

    // Логика ИИ
    if (turn === 'red' && Date.now() - aiTimer > 1200) {
        let rb = bumpers.filter(b => b.team === 'red' && b.vx === 0 && b.vy === 0);
        if (rb.length > 0) {
            let ai = rb[Math.floor(Math.random() * rb.length)], dx = ball.x - ai.x, dy = ball.y - ai.y, d = Math.hypot(dx, dy);
            if (d > 0) { ai.vx = (dx / d) * 11 + (Math.random() - 0.5) * 2; ai.vy = (dy / d) * 11 + (Math.random() - 0.5) * 2; }
        }
        turn = 'blue'; announcement = "Your turn! Drag the blue bumper like a slingshot.";
    }

    // Физика и отрисовка шаров
    bumpers.forEach(b => b.update()); ball.update();
    for (let i = 0; i < bumpers.length; i++) { for (let j = i + 1; j < bumpers.length; j++) collide(bumpers[i], bumpers[j]); collide(bumpers[i], ball); }
    if (ball.x < 50 && ball.y > 330 && ball.y < 410) { scoreRed++; resetMatch(); }
    else if (ball.x > 750 && ball.y > 330 && ball.y < 410) { scoreBlue++; resetMatch(); }
    bumpers.forEach(b => b.draw()); ball.draw();
    
    if (turn === 'blue' && isDragging && selectedBumper) { 
        ctx.strokeStyle = '#ebb432'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(selectedBumper.x, selectedBumper.y); ctx.lineTo(mouseX, mouseY); ctx.stroke(); 
    }

    // 🏛️ ИНСТРУКЦИЯ СТРОГО ПОД ИГРОВЫМ ПОЛЕМ (В отдельной тёмной нижней зоне)
    ctx.fillStyle = '#070d19'; ctx.fillRect(0, 572, 800, 58);
    ctx.fillStyle = '#ebb432'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
    ctx.fillText(announcement, 400, 605);
    ctx.textAlign = 'left'; // Сброс выравнивания для следующего кадра

    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
