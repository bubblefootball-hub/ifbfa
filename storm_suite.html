<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IFBFA - Intellectual Mental Trainer Suite</title>
    <style>
        body { margin: 0; background: #070d19; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; color: #fff; font-family: 'Arial', sans-serif; }
        #game-container { position: relative; box-shadow: 0 0 40px rgba(235,180,50,0.3); border-radius: 10px; overflow: hidden; }
        canvas { display: block; }
        #menu-overlay { position: absolute; top: 140px; left: 0; width: 800px; height: 490px; background: rgba(7,13,25,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .menu-btn { background: #ebb432; color: #070d19; border: none; padding: 12px 30px; margin: 8px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 400px; transition: 0.2s; }
        .menu-btn:hover { background: #fff; box-shadow: 0 0 15px #ebb432; }
        #back-btn { position: absolute; bottom: 15px; left: 20px; background: #dc143c; color: #fff; border: none; padding: 6px 15px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; z-index: 11; display: none; }
    </style>
</head>
<body>
<div id="game-container">
    <button id="back-btn" onclick="goMenu()">MAIN MENU</button>
<!-- 👑 ИДЕАЛЬНО ВЫРОВНЕННАЯ ТРИАДА ЗОЛОТЫХ КНОПОК ПО ШИРИНЕ ОТ IFBFA -->
<a href="https://payhip.com/IFBFA" target="_blank" style="display: inline-block; width: 170px; background: #ebb432; color: #ffffff; border: 2px solid #ffffff; padding: 10px 0; font-size: 11px; font-weight: bold; border-radius: 6px; text-decoration: none; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); box-shadow: 0 4px 10px rgba(0,0,0,0.4); margin-left: 10px; font-family: Arial, sans-serif; text-align: center; box-sizing: border-box;">🛒 VISIT STORE</a>

<a href="hub.html" style="display: inline-block; width: 170px; background: #ebb432; color: #ffffff; border: 2px solid #ffffff; padding: 10px 0; font-size: 11px; font-weight: bold; border-radius: 6px; text-decoration: none; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); box-shadow: 0 4px 10px rgba(0,0,0,0.4); margin-left: 10px; font-family: Arial, sans-serif; text-align: center; box-sizing: border-box;">MAIN HUB</a>

<button onclick="window.location.href='index.html'" style="display: inline-block; width: 170px; background: #ebb432; color: #ffffff; border: 2px solid #ffffff; padding: 10px 0; font-size: 11px; font-weight: bold; border-radius: 6px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); box-shadow: 0 4px 10px rgba(0,0,0,0.4); margin-left: 10px; font-family: Arial, sans-serif; text-align: center; cursor: pointer; box-sizing: border-box;">TO START</button>

<div id="menu-overlay">
        <h2 style="color:#ebb432; margin-bottom:20px; font-size:24px;">SELECT INTELLECTUAL TRAINING DISCIPLINE:</h2>
        <button class="menu-btn" onclick="startGame(1)">1. NEON ACCURACY ARCADE (1v1 Velocity)</button>
        <button class="menu-btn" onclick="startGame(2)">2. BUMPERBALL (3v3 Advanced Cognitive)</button>
        <button class="menu-btn" onclick="startGame(3)">3. BUBBLE FOOTBALL STORM (4v4 Pro Athletic)</button>
        <button class="menu-btn" onclick="startGame(4)">4. FUNNYBALL — CRAZY RICHOSHET (5v5 Chaos)</button>
        <button class="menu-btn" style="background:#fff; color:#070d19;" onclick="startGame(5)">📚 VIEW OFFICIAL IFBFA BOOKSHELF & COMICS</button>
    </div>
    <canvas id="gameCanvas" width="800" height="630"></canvas>
</div>
<script>
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
const menuOverlay = document.getElementById('menu-overlay'), backBtn = document.getElementById('back-btn');
let scoreBlue = 0, scoreRed = 0, turn = 'blue', announcement = "", selectedBumper = null, isDragging = false, aiTimer = 0, mouseX = 0, mouseY = 0;
let currentGame = 0; // 0: Menu, 1-4: Games, 5: Books

class Obj {
    constructor(x, y, r, team, m) { this.x = x; this.y = y; this.radius = r; this.team = team; this.vx = 0; this.vy = 0; this.mass = m; }
    update() {
        this.x += this.vx; this.y += this.vy; this.vx *= 0.97; this.vy *= 0.97;
        if (Math.abs(this.vx) < 0.05) this.vx = 0; if (Math.abs(this.vy) < 0.05) this.vy = 0;
        if (this.team !== 'ball' || currentGame === 4 || (this.y < 330 || this.y > 410)) {
            if (this.x - this.radius < 50) { this.x = 50 + this.radius; this.vx *= -0.8; }
            if (this.x + this.radius > 750) { this.x = 750 - this.radius; this.vx *= -0.8; }
        }
        if (this.y - this.radius < 170) { this.y = 170 + this.radius; this.vy *= -0.8; }
        if (this.y + this.radius > 570) { this.y = 570 - this.radius; this.vy *= -0.8; }
    }
    draw() {
        if (this.team === 'ball') {
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ebb432'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#fff'; ctx.stroke();
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius - 5, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.stroke();
        } else {
            ctx.save();
            if (currentGame === 3 || currentGame === 4) {
                ctx.fillStyle = '#ffffff';
                let dir = (this.team === 'blue') ? 1 : -1;
                ctx.beginPath(); ctx.moveTo(this.x - 7, this.y + this.radius - 3); ctx.lineTo(this.x - 2, this.y + this.radius - 3);
                ctx.lineTo(this.x - 3, this.y + this.radius + 7); ctx.lineTo(this.x - 6, this.y + this.radius + 7); ctx.closePath(); ctx.fill();
                ctx.fillRect(this.x - 7 + (dir === -1 ? -3 : 0), this.y + this.radius + 7, 9, 3); 
                ctx.beginPath(); ctx.moveTo(this.x + 2, this.y + this.radius - 3); ctx.lineTo(this.x + 7, this.y + this.radius - 3);
                ctx.lineTo(this.x + 6, this.y + this.radius + 7); ctx.lineTo(this.x + 3, this.y + this.radius + 7); ctx.closePath(); ctx.fill();
                ctx.fillRect(this.x + 2 + (dir === -1 ? -3 : 0), this.y + this.radius + 7, 9, 3);
            }
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.team === 'blue' ? 'rgba(0, 191, 255, 0.85)' : 'rgba(127, 255, 0, 0.85)';
            ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(this.x, this.y - 5, 5.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillRect(this.x - 4, this.y + 1, 10, 15);
            ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(this.x - 11, this.y + 4); ctx.lineTo(this.x + 11, this.y + 4); ctx.stroke();
            ctx.restore();
        }
        if (selectedBumper === this) { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 6, 0, Math.PI * 2); ctx.lineWidth = 2.5; ctx.strokeStyle = '#ebb432'; ctx.stroke(); }
    }
}

let bumpers = [], balls = [];
function resetMatch() {
    bumpers = []; balls = [];
    if (currentGame === 1) {
        bumpers = [new Obj(200, 370, 24, 'blue', 1.5), new Obj(600, 370, 24, 'red', 1.5)];
        balls.push(new Obj(400, 370, 14, 'ball', 0.8));
    } else if (currentGame === 2) {
        bumpers = [new Obj(200,270,24,'blue',1.5), new Obj(200,470,24,'blue',1.5), new Obj(320,370,24,'blue',1.5), new Obj(600,270,24,'red',1.5), new Obj(600,470,24,'red',1.5), new Obj(480,370,24,'red',1.5)];
        balls.push(new Obj(400, 370, 14, 'ball', 0.8));
    } else if (currentGame === 3) {
        bumpers = [new Obj(170,230,27,'blue',1.6), new Obj(170,370,27,'blue',1.6), new Obj(170,510,27,'blue',1.6), new Obj(290,370,27, 'blue',1.6), new Obj(630,230,27,'red',1.6), new Obj(630,370,27,'red',1.6), new Obj(630,510,27,'red',1.6), new Obj(510,370,27,'red',1.6)];
        balls.push(new Obj(400, 370, 14, 'ball', 0.8));
    } else if (currentGame === 4) {
        bumpers = [new Obj(160,200,27,'blue',1.6), new Obj(160,310,27,'blue',1.6), new Obj(160,420,27,'blue',1.6), new Obj(160,530,27,'blue',1.6), new Obj(270,370,27,'blue',1.6), new Obj(640,200,27,'red',1.6), new Obj(640,310,27,'red',1.6), new Obj(640,420,27,'red',1.6), new Obj(640,530,27,'red',1.6), new Obj(530,370,27,'red',1.6)];
        balls.push(new Obj(400, 270, 13, 'ball', 0.8), new Obj(400, 370, 13, 'ball', 0.8), new Obj(400, 470, 13, 'ball', 0.8));
    }
    turn = 'blue'; announcement = "Your turn! Drag the blue bumper like a slingshot.";
}

function collide(o1, o2) {
    let dx = o2.x - o1.x, dy = o2.y - o1.y, dist = Math.hypot(dx, dy), minDist = o1.radius + o2.radius;
    if (dist < minDist && dist > 0) {
        let overlap = minDist - dist, nx = dx / dist, ny = dy / dist;
        o1.x -= nx * overlap * 0.5; o1.y -= ny * overlap * 0.5; o2.x += nx * overlap * 0.5; o2.y += ny * overlap * 0.5;
        let kx = o1.vx - o2.vx, ky = o1.vy - o2.vy, p = 2 * (nx * kx + ny * ky) / (o1.mass + o2.mass);
        o1.vx -= p * o2.mass * nx; o1.vy -= p * o2.mass * ny; o2.vx += p * o1.mass * nx; o2.vy += p * o1.mass * ny;
    }
}

canvas.addEventListener('mousedown', (e) => {
    if (turn !== 'blue' || currentGame === 0 || currentGame === 5) return; const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    for (let b of bumpers) if (b.team === 'blue' && Math.hypot(b.x - mx, b.y - my) < b.radius) { selectedBumper = b; isDragging = true; break; }
});
canvas.addEventListener('mousemove', (e) => { const r = canvas.getBoundingClientRect(); mouseX = e.clientX - r.left; mouseY = e.clientY - r.top; });
canvas.addEventListener('mouseup', () => {
    if (isDragging && selectedBumper) {
        selectedBumper.vx = (selectedBumper.x - mouseX) * 0.13; selectedBumper.vy = (selectedBumper.y - mouseY) * 0.13;
        selectedBumper = null; isDragging = false; turn = 'red'; aiTimer = Date.now(); announcement = "Opponent's turn... Calculating brain-training trajectory.";
    }
});

function startGame(id) { currentGame = id; menuOverlay.style.display = 'none'; backBtn.style.display = 'block'; resetMatch(); }
function goMenu() { currentGame = 0; menuOverlay.style.display = 'flex'; backBtn.style.display = 'none'; }
function gameLoop() {
    let t = Date.now(); ctx.fillStyle = '#070d19'; ctx.fillRect(0, 0, 800, 630);
    
    if (currentGame === 0) {
        // Фоновая волна золотого флага для главного меню
        for (let x = 0; x < 800; x += 2) {
            let waveY = Math.sin(t * 0.0022 + x * 0.008) * 14, shade = Math.sin(t * 0.0022 + x * 0.008) * 18;
            ctx.fillStyle = `rgb(${220+shade}, ${170+shade}, ${50+shade})`;
            if (x >= 60 && x <= 75) ctx.fillStyle = `rgb(${15+shade}, ${45+shade}, ${145+shade})`;
            ctx.fillRect(x, 0, 2, 630 + waveY);
        }
        ctx.save(); ctx.fillStyle = 'rgba(255, 255, 255, 0.95)'; ctx.font = 'bold 94px Arial'; ctx.textAlign = 'center';
        ctx.fillText("IFBFA", 400, 110 + Math.sin(t * 0.0022 + 400 * 0.008) * 14); ctx.restore();
    }
    else if (currentGame === 5) {
        // ЧЕТВЁРТЫЙ ЗАЛ: Ваша картинка витрины Books.jpg
        ctx.fillStyle = '#0a1428'; ctx.fillRect(0, 0, 800, 480);
        let img = new Image(); img.src = 'books.jpg';
        ctx.drawImage(img, 0, 140, 800, 430);
        
        // Английский заголовок для книжной полки
        ctx.fillStyle = '#ebb432'; ctx.font = 'bold 20px Arial'; ctx.fillText("OFFICIAL IFBFA COMICS & EDUCATIONAL BOOKSHELF", 25, 35);
        ctx.fillStyle = '#ffffff'; ctx.font = '14px Arial';
        ctx.fillText("Discover illustrated stories, rulebooks, and character guides designed by our creators.", 25, 70);
        ctx.fillText("Explore the universe of active brain entertainment and structured gameplay guides below.", 25, 105);
        
        ctx.fillStyle = '#070d19'; ctx.fillRect(0, 572, 800, 58);
        ctx.fillStyle = '#ebb432'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
        
        ctx.textAlign = 'left';
    }
    else {
        // Игровой режим: Волна золотого флага
        for (let x = 0; x < 800; x += 2) {
            let waveY = Math.sin(t * 0.0022 + x * 0.008) * 14, shade = Math.sin(t * 0.0022 + x * 0.008) * 18;
            ctx.fillStyle = `rgb(${220+shade}, ${170+shade}, ${50+shade})`;
            if (x >= 60 && x <= 75) ctx.fillStyle = `rgb(${15+shade}, ${45+shade}, ${145+shade})`;
            ctx.fillRect(x, 0, 2, 330 + waveY);
        }
        ctx.save(); ctx.fillStyle = 'rgba(255, 255, 255, 0.95)'; ctx.font = 'bold 64px Arial'; ctx.textAlign = 'center';
        ctx.fillText("IFBFA", 410, 200 + Math.sin(t * 0.0022 + 400 * 0.008) * 14); ctx.restore();

        // Сетка арены
        ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3; ctx.strokeRect(50, 170, 700, 400);

        // 🏛️ МЕДИЦИНСКАЯ ВСТАВКА «МЕНТАЛЬНЫЙ ШТОРМ» В ХЕДЕРЕ
        ctx.fillStyle = '#070d19'; ctx.fillRect(0, 0, 800, 140);
        ctx.strokeStyle = '#ebb432'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0,140); ctx.lineTo(800,140); ctx.stroke();
        
        ctx.fillStyle = '#ebb432'; ctx.font = 'bold 18px Arial'; ctx.fillText("MENTAL STORM — ACTIVE COGNITIVE BRAIN TRAINER SUITE", 25, 30);
        ctx.fillStyle = '#ffffff'; ctx.font = '12px Arial';
        ctx.fillText("A highly specialized, high-focus gameplay engine designed to enhance spatial agility, boost reflexes, and reset psychomotor tension.", 25, 58);
        ctx.fillText("This interactive system operates as an intense stress-relief mechanism, balancing mental fatigue and stimulating executive function.", 25, 82);
        ctx.fillText("Scientifically calibrated for all age groups. Approved by an Olympic Champions family of medical professionals.", 25, 106);

        // Счёт матча
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px Arial';
        if (currentGame === 4) {
            ctx.fillText(`BLUE: ${scoreBlue}  |  GREEN: ${scoreRed}`, 65, 160);
        } else {
            ctx.fillText(`BLUE: ${scoreBlue}  |  GREEN: ${scoreRed}`, 65, 160);
        }

        // Ворота для стандартных игр (1, 2, 3)
        if (currentGame !== 4) {
            ctx.fillStyle = '#00bfff'; ctx.fillRect(35, 330, 15, 80);
            ctx.fillStyle = '#7fff00'; ctx.fillRect(750, 330, 15, 80);
        }

        // Логика Хода ИИ (Красные/Зелёные фигуры)
        if (turn === 'red' && Date.now() - aiTimer > 1200) {
            let rb = bumpers.filter(b => b.team === 'red' && b.vx === 0 && b.vy === 0);
            if (rb.length > 0) {
                let ai = rb[Math.floor(Math.random() * rb.length)], targetBall = balls[Math.floor(Math.random() * balls.length)];
                let dx = targetBall.x - ai.x, dy = targetBall.y - ai.y, d = Math.hypot(dx, dy);
                if (d > 0) { ai.vx = (dx / d) * 11 + (Math.random() - 0.5) * 2; ai.vy = (dy / d) * 11 + (Math.random() - 0.5) * 2; }
            }
            turn = 'blue'; announcement = "Your turn! Drag the bright-blue bumper like a slingshot.";
        }

        // Обновление физики и рикошетов
        bumpers.forEach(b => b.update());
        balls.forEach(ba => ba.update());

        for (let i = 0; i < bumpers.length; i++) {
            for (let j = i + 1; j < bumpers.length; j++) collide(bumpers[i], bumpers[j]);
            balls.forEach(ba => collide(bumpers[i], ba));
        }
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) collide(balls[i], balls[j]);
        }

                // 🏛️ ЮВЕЛИРНАЯ СИСТЕМА КОНТРОЛЯ МАТЧА И ТАЙМЕРА ОТ IFBFA
        if (currentGame > 0) {
            // Проверяем, начал ли игрок двигаться (появилась ли скорость)
            let isGameActive = bumpers.some(b => b.vx !== 0 || b.vy !== 0) || balls.some(ba => ba.vx !== 0 || ba.vy !== 0);

            // Инициализируем систему при первом запуске режима
            if (!window.lastGameId || window.lastGameId !== currentGame) {
                window.gameStartTime = null;
                window.lastGameId = currentGame;
                scoreBlue = 0;
                scoreRed = 0;
                window.trainingFinished = false;
            }

            // Запускаем таймер только в тот момент, когда шары реально пришли в движение
            if (isGameActive && !window.gameStartTime && !window.trainingFinished) {
                window.gameStartTime = Date.now();
            }

            // Вычисляем оставшееся время
            let timeLeft = 60;
            if (window.gameStartTime) {
                let elapsed = Math.floor((Date.now() - window.gameStartTime) / 1000);
                timeLeft = Math.max(0, 60 - elapsed);
            }

            // Отрисовка таймера на экране (аккуратно у верхней кромки поля)
           

            // Если 60 секунд истекли — завершаем раунд
            if (window.gameStartTime && timeLeft <= 0) {
                window.trainingFinished = true;
                bumpers = []; 
                balls = []; // Очищаем поле для финала
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('TRAINING COMPLETED!', 400, 250);
            }

            // Подсчёт очков работает только во время активного живого матча
            if (window.gameStartTime && !window.trainingFinished) {
                if (currentGame === 4) {
                    // Режим Фаннибол: Считаем очки только при полной остановке ПОСЛЕ начала движения
                    if (balls.length > 0 && Date.now() - aiTimer > 8000 && 
                        bumpers.every(b => b.vx === 0 && b.vy === 0) && 
                        balls.every(ba => ba.vx === 0 && ba.vy === 0)) {
                        
                        let blueSideBalls = balls.filter(ba => ba.x < 400).length;
                        let redSideBalls = balls.filter(ba => ba.x >= 400).length;
                        
                        if (blueSideBalls < redSideBalls) scoreBlue++; 
                        else if (redSideBalls < blueSideBalls) scoreRed++;
                        
                        resetMatch();
                    }
                } else {
                    // Стандартные режимы с воротами
                    if (balls.length > 0) {
                        let mainBall = balls[0];
                        if (mainBall.x < 50 && mainBall.y > 330 && mainBall.y < 410) { scoreRed++; resetMatch(); }
                        else if (mainBall.x > 750 && mainBall.y > 330 && mainBall.y < 410) { scoreBlue++; resetMatch(); }
                    }
                }
            }
        }


        // Отрисовка
        bumpers.forEach(b => b.draw());
        balls.forEach(ba => ba.draw());

        if (turn === 'blue' && isDragging && selectedBumper) {
            ctx.strokeStyle = '#ebb432'; ctx.lineWidth = 3; ctx.beginPath();
            ctx.moveTo(selectedBumper.x, selectedBumper.y); ctx.lineTo(mouseX, mouseY); ctx.stroke();
        }

        // 🏛️ ИНСТРУКЦИЯ СТРОГО ПОД ПОЛЕМ
        ctx.fillStyle = '#070d19'; ctx.fillRect(0, 572, 800, 58);
        ctx.fillStyle = '#ebb432'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
        ctx.fillText(currentGame === 4 ? "PUSH BALLS TO OPPONENT HALF" : announcement, 400, 605);
        ctx.textAlign = 'left';
    }
    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
